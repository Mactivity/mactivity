included:
  - App
  - AppTests
  - Widgets
  - Packages/MactivityKit/Sources
  - Packages/MactivityKit/Tests
  - Packages/MactivityKit/Package.swift
excluded:
  - .claude
  - build
  - Packages/MactivityKit/.build

disabled_rules:
  - trailing_comma          # SwiftFormat owns commas
  - opening_brace           # SwiftFormat owns brace placement
  - todo                    # TODO(name) markers are how open questions are tracked

opt_in_rules:
  - force_unwrapping        # CLAUDE.md rule 10
  - empty_count
  - first_where
  - sorted_first_last
  - contains_over_filter_count
  - redundant_nil_coalescing
  - fatal_error_message

line_length:
  warning: 140
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 1
  excluded: [id, x, y, z, a, b, t]

type_body_length:
  warning: 300
file_length:
  warning: 500
function_body_length:
  warning: 60
cyclomatic_complexity:
  ignores_case_statements: true

custom_rules:
  no_print:
    name: "No print"
    regex: '(^|[^.\w])print\('
    message: "Use os.Logger with the package's subsystem (CLAUDE.md rule 10)."
    severity: error
  no_try_bang:
    name: "No try!"
    regex: 'try!'
    message: "No try! (CLAUDE.md rule 10)."
    severity: error
  no_urlsession:
    name: "No URLSession"
    regex: 'URLSession'
    message: "Only Sparkle talks to the network (CLAUDE.md rule 3). Stop and ask."
    severity: error

function_parameter_count:
  warning: 8
  error: 10

# Parameterized tests pass (input, input, expected) triples.
large_tuple:
  warning: 3
  error: 4
